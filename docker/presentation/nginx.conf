upstream business_backend {
    server mamtemplate-business:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sonde interne de télémétrie du conteneur Presentation (consommée par Business)
    location = /internal/presentation-metrics.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Reverse proxy résilient vers le tiers Business (API métier /api/*, /health*, OpenAPI)
    location ~ ^/(api|health|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://business_backend;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Presentation-Tier "nginx/$nginx_version";
        proxy_set_header X-Presentation-Hostname $hostname;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Application React 19 (sert à la fois l'application métier sur / et le Health Check sur /health-check)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
